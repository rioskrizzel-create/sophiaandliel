<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sophia & Liel | RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face{
    font-family:"Gradientine Signature";
    src:url("https://db.onlinewebfonts.com/t/5be9b310ae7f8db70fa685103f9084e1.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
}
:root{--cream:#f8f4ec;--teal:#2d6667;--navy:#273443;--muted:#69747b;--line:#d8d1c6;--white:#fffdf9;--peach:#df927e}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:"Cormorant Garamond",Georgia,serif}.page{min-height:100vh;padding:55px 20px;display:flex;align-items:center;justify-content:center}.container{width:100%;max-width:850px}.back{color:var(--teal);text-decoration:none;font:10px Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase}.header{text-align:center;margin:25px 0 35px}.small{color:var(--teal);font:10px Montserrat,sans-serif;letter-spacing:.3em;text-transform:uppercase}.names{color:var(--teal);font-size:58px;line-height:1;margin:10px 0}.names span{color:var(--navy);font-family:"Gradientine Signature",cursive;font-size:82px}.sub{color:var(--muted);font:13px Montserrat,sans-serif}.card{background:rgba(255,253,249,.8);border:1px solid var(--line);padding:42px}.intro{text-align:center;color:var(--muted);font-size:18px;line-height:1.6;max-width:620px;margin:0 auto 35px}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:22px}label{display:block;margin-bottom:8px;color:#657079;font:9px Montserrat,sans-serif;letter-spacing:.17em;text-transform:uppercase}input,select,textarea{width:100%;padding:14px 15px;border:1px solid var(--line);background:var(--white);color:var(--navy);font:18px "Cormorant Garamond",Georgia,serif;outline:none}textarea{min-height:105px;resize:vertical}.choices{display:flex;gap:25px;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:8px;color:#59646c;font:12px Montserrat,sans-serif}.choice input{width:auto}.required{color:var(--peach)}button{width:100%;border:0;cursor:pointer;padding:16px 25px;background:var(--teal);color:#fff;font:10px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase}button:disabled{opacity:.6}.note{text-align:center;margin-top:15px;color:#788087;font:9px Montserrat,sans-serif;line-height:1.7}.success{text-align:center;padding:35px 10px}.success .heart{color:var(--peach);font-size:42px}.success h2{color:var(--teal);font-size:46px;font-weight:400;margin:8px}.success p{color:var(--muted);font:14px Montserrat,sans-serif;line-height:1.8}@media(max-width:650px){.page{padding:30px 15px}.card{padding:28px 20px}.row{grid-template-columns:1fr;gap:0}.names{font-size:48px}.names span{font-size:60px}}

/* Vintage coastal invitation style */
:root{
    --cream:#f4f0e8;
    --teal:#77736b;
    --navy:#5d5a54;
    --muted:#817d75;
    --line:#d3cec4;
    --white:#faf7f0;
    --peach:#9a948a;
}

body{background:var(--cream);color:var(--navy);font-family:"Cormorant Garamond",Georgia,serif}
.page{padding:55px 20px}
.back,.small,label,.note,.choice,button{font-family:"Cormorant Garamond",Georgia,serif}
.back{color:#77736b;font-size:12px;font-weight:600;letter-spacing:.2em}
.header{text-align:center;margin:30px 0 38px}
.small{color:#77736b;font-size:13px;font-weight:600;letter-spacing:.28em}
.names{
    color:#6f6b64;
    font-family:"Gradientine Signature",cursive;
    font-size:78px;
    line-height:.9;
    margin:15px 0;
}
.names span{color:#6f6b64;font-family:"Gradientine Signature",cursive;font-size:82px}
.sub{color:#817d75;font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;letter-spacing:.15em}
.card{background:rgba(250,247,240,.82);border:1px solid var(--line);padding:42px}
.intro{color:#77736b;font-size:20px;line-height:1.55}
label{color:#77736b;font-size:11px;font-weight:600;letter-spacing:.18em}
input,select,textarea{
    border:1px solid var(--line);
    background:#fbf8f1;
    color:#5d5a54;
    font:19px "Cormorant Garamond",Georgia,serif;
}
.choice{color:#77736b;font-size:14px}
.required{color:#9a948a}
button{background:#6f6b63;color:#fdfaf4;font-size:12px;font-weight:600;letter-spacing:.2em;border-radius:0}
.note{color:#817d75;font-size:11px;letter-spacing:.05em}
.success .heart{color:#8c877f}
.success h2{color:#6f6b64;font-family:"Cormorant Garamond",Georgia,serif;font-size:52px}
.success p{color:#77736b;font-family:"Cormorant Garamond",Georgia,serif;font-size:18px}

@media(max-width:650px){
    .names{font-size:60px}
    .names span{font-size:64px}
    .card{padding:28px 20px}
}

</style>
</head>
<body>
<div class="page"><div class="container">
<a class="back" href="index.html">← Back to Wedding Website</a>
<div class="header">
<div class="small">Sophia & Liel</div>
<div class="names">Sophia <span>&amp; Liel</span></div>
<div class="sub">Punta Mita, Mexico · March 26, 2026</div>
</div>

<div class="card" id="card">
<p class="intro">We would love to celebrate with you! Please fill out the form below to let us know if you'll be joining us.</p>

<form id="rsvpForm">
<div class="row">

<div class="field">
<label>Your Name <span class="required">*</span></label>
<input name="name" required placeholder="Your full name">
</div>

<div class="field">
<label>Email Address <span class="required">*</span></label>
<input
type="email"
name="email"
required
placeholder="Your email address"
>
</div>

</div>

<div class="field">
<label>Number of Guests <span class="required">*</span></label>
<select name="guests" required>
<option value="">Please select</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>
</div>

<div class="field"><label>Will you be joining us? <span class="required">*</span></label>
<div class="choices">
<label class="choice"><input type="radio" name="attendance" value="Joyfully Accepts" required> Joyfully Accepts</label>
<label class="choice"><input type="radio" name="attendance" value="Regretfully Declines"> Regretfully Declines</label>
</div></div>

<div class="row">
<div class="field"><label>Arrival Date</label><input type="date" name="arrival"></div>
<div class="field"><label>Departure Date</label><input type="date" name="departure"></div>
</div>

<div class="field"><label>Where will you be staying?</label><input name="stay" placeholder="Hotel / accommodation"></div>
<div class="field"><label>Message to Sophia & Liel</label><textarea name="message" placeholder="Leave us a little note..."></textarea></div>

<button type="submit" id="submitBtn">Submit RSVP</button>
<div class="note">Your RSVP will be recorded securely and the wedding team will receive an email notification.</div>
</form>
</div>
</div></div>

<script>
const RSVP_ENDPOINT = "https://script.google.com/macros/s/AKfycbweDnnv9KLPs2BTu78LDtoo_sWW6Jfqi0MwMlgQajMf4NY6YEvYxh8KwBqentgDlQku4Q/exec";
const form = document.getElementById("rsvpForm");
const card = document.getElementById("card");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function(e){
    e.preventDefault();

    if(RSVP_ENDPOINT.includes("PASTE_YOUR")){
        alert("The RSVP form still needs to be connected to Google Sheets.");
        return;
    }

    button.disabled = true;
    button.textContent = "Submitting...";

    const formData = new FormData(form);
    const body = new URLSearchParams(formData);

    try {
        await fetch(RSVP_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            body: body
        });

        card.innerHTML = `
            <div class="success">
                <div class="heart">♡</div>
                <h2>Thank You!</h2>
                <p>Your RSVP has been received.<br>
                We are so excited to celebrate with you in Punta Mita!</p>
                <a class="back" href="index.html">Back to Wedding Website</a>
            </div>`;
    } catch(error) {
        button.disabled = false;
        button.textContent = "Submit RSVP";
        alert("Something went wrong. Please try again.");
    }
});
</script>
</body>
</html>
